name: Update the script lists
on:
  push:
    branches: [main]
    paths: ["scripts/**"]
permissions:
  contents: write
concurrency: lists
jobs:
  lists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write each console's index.json
        run: python3 tools/build-lists.py
      - name: Commit them
        run: |
          if git diff --quiet; then echo "lists up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/*/index.json
          git commit -m "Script lists updated"
          git push
