name: Check scripts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Check every script
        run: python3 tools/check.py --lua luac5.4
