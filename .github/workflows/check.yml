name: Check scripts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Check every script
        run: python3 tools/check.py --lua luac5.4
      - name: scripts/ is made from games/, not edited
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- scripts/)
          if [ -n "$changed" ]; then
            echo "These files are made from games/ after the merge; leave them out of the pull request:"
            echo "$changed"
            exit 1
          fi
